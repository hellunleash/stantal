name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A run that is superseded is a run nobody reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor the manifest claims, current LTS, and current. A package
        # that says `>=20` and is only ever run on one version is claiming
        # something nobody checked.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci`, not `install`, so a lockfile that disagrees with the manifest
      # fails here instead of resolving to something nobody recorded.
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # No API keys are configured for this workflow, on purpose. The suite is
      # fixture-backed and offline, and it stays that way only if the place it
      # runs most often has no way to reach a model.
      - name: Test
        run: npx vitest run

      # The published artifact is `dist`. A suite that passes while the build
      # is broken tells a user nothing about what `npx stantal` will do.
      - name: Build
        run: npm run build

      - name: The bin the manifest promises exists and runs
        run: node dist/cli.js --help

  private:
    name: nothing private is tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # `docs/` holds the research trail, an unshipped case study, competitor
      # notes and measured numbers that are not published anywhere. CLAUDE.md
      # is the working brief. Neither has ever been committed, and the point of
      # this job is that the claim stops depending on anyone remembering.
      #
      # Checked against the index rather than the working tree: a file can sit
      # on disk ignored and harmless, and the only thing that matters is
      # whether git is carrying it.
      - name: No private path is tracked
        run: |
          tracked=$(git ls-files -- \
            'docs/' 'CLAUDE.md' 'AGENTS.md' 'notes/' 'scratch/' '.claude/' \
            '.env' '.env.local' '*.private.md' '.stantal/')
          if [ -n "$tracked" ]; then
            echo "::error::these are tracked and must not be:"
            echo "$tracked"
            exit 1
          fi
          echo "clean — nothing private is tracked"

      # The template is public and must stay a template. A key pasted into it
      # is the one mistake that has actually happened on this repo before.
      - name: The env template carries no key material
        run: |
          if [ -f .env.example ] && grep -qE '(sk-[A-Za-z0-9]|AIza[A-Za-z0-9]|pm_live_|gho_)' .env.example; then
            echo "::error::.env.example contains something shaped like a real credential"
            exit 1
          fi
          echo "clean — .env.example carries no key material"

  no-key:
    name: the first run works with no key
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # C1: a first `npx stantal` works with no account, no config and no key.
      # That has been true by design and enforced nowhere, so it has been one
      # careless `judgeFromEnv()` away from being false at any point.
      #
      # Every provider variable is explicitly emptied rather than merely left
      # unset, so the job still proves something on a runner that has one.
      - name: A real verdict comes out with every key unset
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          GOOGLE_ACCESS_TOKEN: ""
          STANTAL_VERTEX_PROJECT: ""
        run: |
          set -o pipefail
          report=$(mktemp)

          # Two real published versions of a package that ships tool
          # descriptors. Exit 1 is the product answering "found", which is a
          # pass here; only a crash or an unreadable run is a failure.
          set +e
          node dist/cli.js @modelcontextprotocol/server-filesystem 2025.7.1 2025.8.21 --json > "$report"
          status=$?
          set -e

          if [ "$status" -gt 1 ]; then
            echo "::error::exit $status with no key — a keyless run must still produce a verdict"
            head -c 2000 "$report"
            exit 1
          fi

          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (r.verdict === "unreadable") throw new Error("keyless run read nothing");
            if (r.judge !== "none") throw new Error(`a judge ran without a key: ${r.judge}`);
            if (r.caller !== "none") throw new Error(`a caller ran without a key: ${r.caller}`);
            console.log(`keyless verdict: ${r.verdict}, judge: ${r.judge}, caller: ${r.caller}`);
          ' "$report"
